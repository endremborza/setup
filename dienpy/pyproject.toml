[project]
name = "dienpy"
dynamic = ["version", "description"]
dependencies = [
    "protocli>=0.2.0",
    "requests",
    "rich",
    "dienraw",
    "moac[api]",
    "setup",
]

[project.optional-dependencies]
tts = ["kokoro-onnx>=0.5.0", "sounddevice>=0.5.5"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
dienpy = "dienpy.__main__:main"

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.uv.sources]
dienraw = { path = "../dienraw", editable = true }
moac = { path = "../moac", editable = true }
setup = { path = "../setup", editable = true }
