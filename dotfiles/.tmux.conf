set-window-option -g mode-keys vi
set-option -g status-position top
set-option -g focus-events on

unbind Space ; unbind E ; unbind M-1 ; unbind M-2 ; unbind M-3 ; unbind M-4 ; unbind M-5 ; unbind M-6 ; unbind M-7
unbind C-o ; unbind M-o ; unbind '{' ; unbind '}' ; unbind o
unbind M-Up ; unbind M-Down ; unbind M-Left ; unbind M-Right
unbind '#' ; unbind - ; unbind =
unbind ( ; unbind ) ; unbind L ; unbind D ; unbind C-z
unbind m ; unbind M ; unbind M-n ; unbind M-p ; unbind < ; unbind >
unbind t ; unbind r ; unbind i ; unbind '~' ; unbind C ; unbind q ; unbind "'" ; unbind . ; unbind * ; unbind '$'
unbind DC ; unbind S-Up ; unbind S-Down ; unbind S-Left ; unbind S-Right ; unbind PPage ; unbind f ; unbind s

# hjkl and the arrows are one key each: a Go60 Mod-layer arrow whose Mod is missed sends the bare letter
bind -N "Select the pane to the left" h select-pane -L
bind -N "Select the pane below" j select-pane -D
bind -N "Select the pane above" k select-pane -U
bind -N "Select the pane to the right" l select-pane -R
bind -N "Select the pane to the left" Left select-pane -L
bind -N "Select the pane below" Down select-pane -D
bind -N "Select the pane above" Up select-pane -U
bind -N "Select the pane to the right" Right select-pane -R
bind -r -N "Resize the pane left" C-h resize-pane -L
bind -r -N "Resize the pane down" C-j resize-pane -D
bind -r -N "Resize the pane up" C-k resize-pane -U
bind -r -N "Resize the pane right" C-l resize-pane -R

bind -N "Open git status and diff panes beside this one" g run-shell "tmuxwrap git"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'

run '~/.tmux/plugins/tpm/tpm'
